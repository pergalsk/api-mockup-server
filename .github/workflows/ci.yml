name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions pinned to full commit SHA (GitHub security hardening guide).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev

      # Fails if test or example files would be published to npm.
      - name: Package check
        shell: bash
        run: |
          files=$(npm pack --dry-run --json | node -p "JSON.parse(require('fs').readFileSync(0)).flatMap(p => p.files.map(f => f.path)).join('\n')")
          echo "$files"
          if echo "$files" | grep -E '(^|/)(examples|__tests__)/'; then
            echo "::error::examples/ or __tests__/ would be published"
            exit 1
          fi
